server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fashionstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:fashionStoreJwtSecretKey2024VeryLongSecretKeyForSecurityPurposes}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in ms

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:your_razorpay_key_id}
    secret: ${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads/}

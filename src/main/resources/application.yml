server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fashionstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: fashionStoreJwtSecretKey2024VeryLongSecretKeyForSecurityPurposes
    expiration: 86400000  # 24 hours in ms

razorpay:
  key:
    id: your_razorpay_key_id
    secret: your_razorpay_key_secret

file:
  upload:
    dir: uploads/
